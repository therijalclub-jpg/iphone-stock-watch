name: Test Email Alert

on:
  workflow_dispatch:

jobs:
  send-test-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send test email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          msg = EmailMessage()
          msg["Subject"] = "iPhone Stock Watch Test"
          msg["From"] = os.environ["SMTP_USERNAME"]
          msg["To"] = os.environ["ALERT_EMAIL"]
          msg.set_content(
              "Test successful.\n\n"
              "Your iPhone stock watcher can send email alerts correctly."
          )

          context = ssl.create_default_context()

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465,
              context=context
          ) as server:
              server.login(
                  os.environ["SMTP_USERNAME"],
                  os.environ["SMTP_APP_PASSWORD"]
              )
              server.send_message(msg)

          print("Test email sent successfully.")
          PY
